name: CI/CD Pipeline (Local Runner)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    # Como você instalou o runner na sua própria máquina, usamos a tag 'self-hosted'
    # Isso fará o GitHub enviar os comandos para o runner que está 'Listening for Jobs' na sua tela!
    runs-on: self-hosted

    steps:
      # Passo 1: Baixar o código mais recente do repositório para a sua máquina local
      - name: Checkout do Código
        uses: actions/checkout@v4

      # Passo 2: Instalar dependências para testes
      - name: Instalar dependências de testes
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx flake8
          pip install -r requirements.txt

      # Passo 3: Rodar o Linter (Flake8) para verificar a qualidade do código
      - name: Verificar padronização de código (Lint)
        run: flake8 . --exclude=venv,.venv,__pycache__ --count --select=E9,F63,F7,F82 --show-source --statistics

      # Passo 4: Rodar os testes unitários da API
      - name: Rodar Testes com Pytest
        env:
          URL_API: http://127.0.0.1:8001/telemetria
          DATABASE_URL: sqlite:///./test.db
          MEU_EMAIL: "teste@teste.com"
          SENHA_DE_APP: "senha_teste"
          GEMINI_API_KEY: "CHAVE_FALSA_PARA_TESTES_PASSAREM"
        run: pytest tests/

      # Passo 5: Copiar o arquivo .env existente da sua máquina original
      - name: Copiar .env original
        run: |
          Copy-Item "c:\xampp\htdocs\AIOps*\api_ia_profissional\.env" -Destination .\.env

      # Passo 6: Reiniciar os containers Docker com as alterações mais recentes
      # Como é self-hosted, ele vai rodar os comandos do Docker diretamente na sua máquina
      - name: Deploy com Docker Compose
        run: |
          docker-compose down
          docker-compose up -d --build

      # Passo 4: Verificar se a API subiu corretamente e está respondendo
      - name: Healthcheck da API
        run: |
          echo "Aguardando a API subir..."
          Start-Sleep -Seconds 10
          Invoke-RestMethod -Uri "http://localhost:8001/docs" -Method GET
        # O comando acima usa PowerShell (pois seu runner local está no Windows)
